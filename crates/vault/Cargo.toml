[package]
name = "vault-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
pkcs11 = ["dep:cryptoki"]

[dependencies]
vault-policy = { path = "../policy", features = ["wire"] }
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
cryptoki = { version = "0.12.1", optional = true }
hex = "0.4"
hpke = { version = "0.15.1", default-features = false, features = ["getrandom", "alloc", "x25519", "nistp", "chacha"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "ecdh"] }
hkdf = "0.12"
nix = { version = "0.31.3", features = ["user", "resource", "process", "signal", "fs"] }
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch", "extra-checks"] }
postgres = "0.19"
postgres-openssl = "0.5"
openssl = "0.10"
rustls = "0.23"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
vault-platform = { path = "../platform" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wat = "1"

[build-dependencies]
sha2 = "0.10"

[lints]
workspace = true
