name: Verification and evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev openjdk-21-jre-headless
      - run: python3 scripts/restore-vendor.py
      - run: bash scripts/prepare-tools.sh
      - run: python3 scripts/verify.py --with-docker --output evidence/runs/linux
      - run: cp target/release/vault-rs evidence/runs/linux/vault-rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-evidence
          path: evidence/runs/
  macos-software-verification:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore verified sources and record environment
        run: |
          mkdir -p evidence/macos .tools
          printf 'int main(void) { return 0; }\n' > .tools/macho-loader-probe.c
          cc -Wl,-no_uuid .tools/macho-loader-probe.c -o .tools/macho-loader-probe
          .tools/macho-loader-probe
          python3 scripts/restore-vendor.py
          python3 scripts/release-evidence.py begin-macos --directory evidence/macos
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          sw_vers > evidence/macos/platform.txt
      - name: Confidential image packaging rules
        run: python3 scripts/test-confidential-guest.py
      - name: Native Rust unit and integration tests
        run: cargo test --locked --workspace --all-features 2>&1 | tee evidence/macos/tests.log
      - name: Build installable Rust binary and software fixture
        run: bash scripts/build-release.sh 2>&1 | tee evidence/macos/build.log
      - name: Real OAuth authorization server
        run: bash scripts/test-oauth.sh 2>&1 | tee evidence/macos/oauth.log
      - name: Compile Secure Enclave helper
        run: swiftc platform/macos/SecureEnclaveHelper.swift -o /tmp/vault-se-helper 2>&1 | tee evidence/macos/swift.log
      - name: Real UID, memory, descriptor and ACL isolation
        timeout-minutes: 3
        run: |
          cargo test --locked -p vault-rs --lib --no-run --message-format=json > /tmp/vault-test-build.jsonl
          test_binary=$(python3 -c 'import json; print(next(v["executable"] for line in open("/tmp/vault-test-build.jsonl") if (v:=json.loads(line)).get("reason")=="compiler-artifact" and v.get("profile",{}).get("test") and v.get("executable")))')
          cc -O2 -Wall -Wextra -Werror tools/isolation-fixture.c -o /tmp/isolation-fixture
          sudo install -m 755 /tmp/isolation-fixture /opt/isolation-fixture
          sudo mkdir -p /opt/vault-ci
          sudo install -m 755 target/release/vault-rs /opt/vault-ci/vault-rs
          sudo install -m 755 "$test_binary" /opt/vault-ci/vault-tests
          printf 'TESTED_BINARY_SHA256 %s\n' "$(shasum -a 256 /opt/vault-ci/vault-rs | cut -d ' ' -f1)" | tee evidence/macos/os-isolation.log
          sudo env VAULT_TEST_RUNNER_BIN=/opt/vault-ci/vault-rs /opt/vault-ci/vault-tests runner::tests::os_isolation_with_real_uids_and_inherited_pipe --ignored --nocapture --test-threads=1 2>&1 | tee -a evidence/macos/os-isolation.log
      - name: CLI HTTPS, two subjects, restart and revocation
        timeout-minutes: 3
        run: |
          cargo test --locked -p vault-rs --test deployment --no-run --message-format=json > /tmp/vault-deployment-build.jsonl
          deployment_binary=$(python3 -c 'import json; print(next(v["executable"] for line in open("/tmp/vault-deployment-build.jsonl") if (v:=json.loads(line)).get("reason")=="compiler-artifact" and v.get("target",{}).get("name")=="deployment" and v.get("executable")))')
          sudo install -m 755 target/release/examples/deployment_fixture /opt/deployment-test-helper
          sudo install -m 755 "$deployment_binary" /opt/vault-ci/deployment-tests
          printf 'TESTED_BINARY_SHA256 %s\n' "$(shasum -a 256 /opt/vault-ci/vault-rs | cut -d ' ' -f1)" | tee evidence/macos/deployment.log
          sudo env VAULT_TEST_RUNNER_BIN=/opt/vault-ci/vault-rs VAULT_TEST_MACOS_KEY_UID="$(id -u)" /opt/vault-ci/deployment-tests --ignored --nocapture --test-threads=1 2>&1 | tee -a evidence/macos/deployment.log
      - name: Verify byte-identical clean rebuild
        run: python3 scripts/check-reproducible.py 2>&1 | tee evidence/macos/clean-rebuild.log
      - name: Bind evidence to sources and binaries
        run: |
          shasum -a 256 target/release/vault-rs /tmp/vault-se-helper > evidence/macos/binaries.sha256
          python3 scripts/release-evidence.py finish-macos --directory evidence/macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-software-evidence
          path: evidence/macos/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: macos-repro-diagnostic
          path: .tools/repro-failure/
          include-hidden-files: true
          if-no-files-found: ignore
      # These are actual macOS software tests; physical SE presence is excluded.
  release-evidence:
    needs: [linux, macos-software-verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/restore-vendor.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: linux-evidence
          path: evidence/ci-linux
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: macos-software-evidence
          path: evidence/ci-macos
      - name: Evaluate identical sources and package verified software
        run: python3 scripts/package-release.py --linux evidence/ci-linux/linux --macos evidence/ci-macos --output evidence/release-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-software-release
          path: evidence/release-bundle/
          if-no-files-found: error
